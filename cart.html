<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your Cart | India Unboxed</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div id="site-header"></div>
  <main>
    <section class="page-hero"><div class="container"><span class="eyebrow">YOUR BOX</span><h1>Ready to unbox?</h1><p>Review your regional discoveries before checkout.</p></div></section>
    <section class="section"><div class="container cart-layout">
      <div id="cart-items"></div>
      <aside class="cart-summary"><h2>Order summary</h2><div class="summary-row"><span>Subtotal</span><b id="cart-subtotal">₹0</b></div><div class="summary-row"><span>Shipping</span><b>Calculated later</b></div><hr><div class="summary-row total"><span>Total</span><b id="cart-total">₹0</b></div><button class="btn btn-primary full" onclick="checkoutDemo()">Proceed to checkout</button><p class="small-note">Demo checkout for GitHub testing. Connect WooCommerce/payment gateway before accepting real orders.</p></aside>
    </div></section>
  </main>
  <div id="site-footer"></div>
  <script src="js/app.js"></script>
</body>
</html>
