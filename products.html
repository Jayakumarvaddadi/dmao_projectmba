<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shop | India Unboxed</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div id="site-header"></div>
  <main>
    <section class="page-hero"><div class="container"><span class="eyebrow">THE MARKETPLACE</span><h1>Shop regional India.</h1><p>Browse authentic snacks by category, region or flavour.</p></div></section>
    <section class="section">
      <div class="container">
        <div class="shop-toolbar">
          <div class="search-wrap">🔎 <input id="product-search" type="search" placeholder="Search snacks, states, flavours..."></div>
          <select id="category-filter"><option value="all">All categories</option><option>Savoury & Spicy</option><option>Sweets</option><option>Chips & Crisps</option><option>Healthy Snacks</option><option>Beverages</option></select>
          <select id="region-filter"><option value="all">All regions</option><option>South India</option><option>North India</option><option>West India</option><option>East India</option></select>
        </div>
        <div class="product-grid" id="all-products"></div>
        <div id="empty-products" class="empty-state hidden">No products found. Try another search.</div>
      </div>
    </section>
  </main>
  <div id="site-footer"></div>
  <script src="js/products.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
